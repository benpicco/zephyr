# SPDX-License-Identifier: Apache-2.0

description: Microchip MRF24J40 2.4 GHz IEEE 802.15.4 transceiver

compatible: "microchip,mrf24j40"

include: spi-device.yaml

properties:
  irq-gpios:
    type: phandle-array
    required: true
    description: |
      Interrupt output (INT) from the radio. The driver configures the
      radio for a rising-edge interrupt, so this must be GPIO_ACTIVE_HIGH.

  reset-gpios:
    type: phandle-array
    required: true
    description: |
      Hardware reset input (RESET). The pin is active-low, so this should
      be GPIO_ACTIVE_LOW.

  local-mac-address:
    type: uint8-array
    min-len: 8
    max-len: 8
    description: IEEE 802.15.4 extended address
