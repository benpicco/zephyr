title: Microchip G1 GMAC Ethernet Controller

description: |
  Microchip GMAC Ethernet

  Group G1 Ethernet device supports following hardware peripherals:
    - module name="GMAC" id="U2005" version="1.0.0"

  The MDIO bus is provided by this device and is used to communicate
  with Ethernet PHY.

compatible: "microchip,gmac-g1-eth"

include:
  - name: ethernet-controller.yaml
  - name: pinctrl-device.yaml

properties:
  phy-handle:
    required: true

  num-queues:
    type: int
    required: true
    description: |
      Number of hardware TX and RX queues.
      Range: 1 - 8

  phy-connection-type:
    default: "rmii"

  clocks:
    type: phandle-array

  microchip,gmac-has-wrapper:
    type: boolean
    description: |
      Some GMAC instances (e.g. PIC32CZ CA80/CA90) place the Cadence GEM
      core registers behind an additional wrapper register block (clock
      request/enable, AXI master port configuration, write-protect
      control) starting at offset 0x0, with the GEM core itself appearing
      at a fixed offset within the peripheral's register space. Set this
      property when such a wrapper is present so the driver performs the
      extra wrapper enable/clock-request sequence before touching the
      core GMAC registers.

examples:
  - |
    &gmac {
      compatible = "microchip,gmac-g1-eth";
      interrupts = <84 0>;
      interrupt-names = "gmac";
      num-queues = <1>;
    };
